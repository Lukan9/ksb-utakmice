name: Osvezi utakmice

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper/scrape.py
      - name: Sačuvaj promene
        run: |
          git config user.name "osvezi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add utakmice.json
          git diff --staged --quiet || (git commit -m "Osvezene utakmice" && git push)
