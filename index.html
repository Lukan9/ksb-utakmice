<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>KSB utakmice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KSB utakmice">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --maple: #ebd3a8;
    --maple-dark: #d8b97f;
    --card: #f8f0de;
    --ink: #14213a;
    --muted: #5d6679;
    --key: #2c4a7a;
    --ball: #c9581c;
    --night: #18243a;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-num: "Arial Narrow", "Roboto Condensed", "Helvetica Neue Condensed", Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: var(--maple);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  header {
    background: var(--night);
    color: #f6ead0;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
  }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: .01em; }
  header p { margin: 2px 0 0; font-size: .82rem; color: #b9c3d6; }

  .search {
    position: sticky; top: 0; z-index: 5;
    background: var(--maple);
    padding: 12px 14px 10px;
    border-bottom: 2px solid var(--maple-dark);
  }
  .row { display: flex; gap: 8px; }
  .field { flex: 1; min-width: 0; }
  .field.date { flex: 0 0 38%; }
  label { display: block; font-size: .78rem; color: var(--muted); margin: 0 0 3px 2px; }
  input {
    width: 100%; font: inherit; font-size: 1.05rem;
    padding: 12px 12px; border-radius: 10px;
    border: 2px solid var(--maple-dark); background: #fffaf0; color: var(--ink);
  }
  input:focus-visible { outline: 3px solid var(--key); outline-offset: 1px; border-color: var(--key); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: .82rem; color: var(--muted); }
  button.clear {
    font: inherit; font-size: .85rem; color: var(--key); background: none;
    border: 0; padding: 6px 4px; cursor: pointer; text-decoration: underline;
  }
  button.clear:focus-visible { outline: 3px solid var(--key); border-radius: 4px; }

  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  button.tab {
    flex: 1; font: inherit; font-size: .88rem; padding: 8px 6px; cursor: pointer;
    border-radius: 999px; border: 2px solid var(--maple-dark);
    background: #fffaf0; color: var(--ink);
  }
  button.tab[aria-pressed="true"] { background: var(--night); color: #f6ead0; border-color: var(--night); }
  button.tab:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
  .score.soon { background: var(--ball); color: #fff; font-size: 1.05rem; padding: 4px 9px; }

  .actions { display: flex; align-items: center; gap: 4px; }
  button.refresh {
    font: inherit; font-size: .85rem; color: #fff; background: var(--key);
    border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button.refresh:active { opacity: .8; }
  button.refresh:disabled { opacity: .6; }
  button.refresh:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  li.item { position: relative; }
  li.item a.match { padding-right: 52px; }
  button.star {
    position: absolute; top: 4px; right: 4px;
    width: 44px; height: 44px; border: 0; background: none;
    font-size: 1.6rem; line-height: 1; color: #a39a85; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  button.star.on { color: #e0a400; }
  button.star:focus-visible { outline: 3px solid var(--key); border-radius: 8px; }
  li.item.fav a.match { background: #fbf3d9; }

  main { padding: 12px 14px 40px; max-width: 760px; margin: 0 auto; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.match {
    display: block; text-decoration: none; color: inherit;
    background: var(--card);
    border-radius: 12px;
    border-left: 6px solid var(--key);
    padding: 10px 12px 12px;
    box-shadow: 0 1px 0 rgba(20, 33, 58, .15);
  }
  a.match:active { background: #f1e5c9; }
  a.match:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
  a.match.pending { border-left-color: var(--ball); }
  .top { display: flex; justify-content: space-between; gap: 10px; font-size: .78rem; color: var(--muted); }
  .top .when { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; }
  .team { font-weight: 600; font-size: 1rem; line-height: 1.2; overflow-wrap: anywhere; }
  .team.away { text-align: right; }
  .score {
    font-family: var(--font-num); font-weight: 700; font-size: 1.6rem;
    background: var(--night); color: #f6ead0; padding: 2px 10px; border-radius: 8px;
    white-space: nowrap; letter-spacing: .02em;
  }
  .score.none { font-size: .8rem; font-family: var(--font); font-weight: 600; background: var(--ball); color: #fff; padding: 5px 8px; }
  button.more { display: block; width: 100%; margin: 12px 0 24px; padding: 13px; font: 600 1rem var(--font); background: var(--night); color: #f6ead0; border: 0; border-radius: 10px; cursor: pointer; }
  button.more[hidden] { display: none; }
  .state { text-align: center; color: var(--muted); padding: 28px 10px; line-height: 1.5; }
  .state strong { color: var(--ink); display: block; margin-bottom: 4px; }
  @media (prefers-reduced-motion: no-preference) {
    a.match { transition: background .15s; }
  }
</style>
</head>
<body>
<header>
  <h1>KSB utakmice</h1>
  <p>Košarkaški savez Beograda · pretraga po ekipi i datumu</p>
</header>

<div class="search">
  <div class="row">
    <div class="field">
      <label for="q">Ekipa ili utakmica</label>
      <input id="q" type="search" placeholder="npr. zvezda partizan" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field date">
      <label for="d">Datum</label>
      <input id="d" type="text" inputmode="decimal" placeholder="20.11 ili 20.11.2026" autocomplete="off">
    </div>
  </div>
  <div class="tabs" role="group" aria-label="Prikaz utakmica">
    <button class="tab" type="button" data-mode="upcoming" aria-pressed="false">Predstojeće</button>
    <button class="tab" type="button" data-mode="played" aria-pressed="false">Odigrane</button>
    <button class="tab" type="button" data-mode="all" aria-pressed="false">Sve</button>
  </div>
  <div class="meta">
    <span id="count"></span>
    <div class="actions">
      <button class="refresh" id="refresh" type="button">↻ Osveži</button>
      <button class="clear" id="clear" type="button">Obriši</button>
    </div>
  </div>
</div>

<main>
  <ul class="list" id="list" aria-live="polite"></ul>
  <div class="state" id="state"></div>
  <button class="more" id="more" type="button" hidden>Prikaži još</button>
</main>

<script>
(function () {
  "use strict";

  // Ćirilica -> latinica, bez dijakritika, da "zvezda" nađe "Звезда"
  var MAP = {
    "а":"a","б":"b","в":"v","г":"g","д":"d","ђ":"dj","е":"e","ж":"z","з":"z","и":"i","ј":"j",
    "к":"k","л":"l","љ":"lj","м":"m","н":"n","њ":"nj","о":"o","п":"p","р":"r","с":"s","т":"t",
    "ћ":"c","у":"u","ф":"f","х":"h","ц":"c","ч":"c","џ":"dz","ш":"s","đ":"dj"
  };
  function norm(s) {
    s = String(s || "").toLowerCase();
    var out = "";
    for (var i = 0; i < s.length; i++) out += (MAP[s[i]] !== undefined ? MAP[s[i]] : s[i]);
    return out.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }

  // Datum: 20.11 | 20,11 | 20 11 | 20-11-2026 | 20 (samo dan)
  // loose=true za polje "Datum" (iOS decimalna tastatura daje zarez),
  // loose=false za tekst u polju ekipa (da ne hvata slucajne brojeve)
  var DATE_STRICT = /(\d{1,2})\s*[.\-\/]\s*(\d{1,2})(?:\s*[.\-\/]\s*(\d{2,4}))?\.?/;
  var DATE_LOOSE  = /(\d{1,2})\s*[.,\-\/\s]\s*(\d{1,2})(?:\s*[.,\-\/\s]\s*(\d{2,4}))?\s*[.,]?/;

  function parseDate(text, loose) {
    var s = String(text || "");
    var m = s.match(loose ? DATE_LOOSE : DATE_STRICT);
    if (m) {
      var mo = parseInt(m[2], 10);
      var dd = parseInt(m[1], 10);
      if (mo >= 1 && mo <= 12 && dd >= 1 && dd <= 31) {
        var y = m[3] ? parseInt(m[3], 10) : null;
        if (y !== null && y < 100) y += 2000;
        return { d: dd, m: mo, y: y, raw: m[0] };
      }
    }
    if (loose) {
      var only = s.match(/^\s*(\d{1,2})\s*[.,]?\s*$/);   // samo dan, npr. "20"
      if (only) {
        var d1 = parseInt(only[1], 10);
        if (d1 >= 1 && d1 <= 31) return { d: d1, m: null, y: null, raw: only[0] };
      }
    }
    return null;
  }

  var all = [];
  var mode = null;   // "upcoming" | "played" | "all"; null = automatski izbor
  function todayIso() {
    var n = new Date();
    return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
  }
  function hasScore(m) {
    return m.home_score !== null && m.home_score !== undefined && m.home_score !== "" &&
           m.away_score !== null && m.away_score !== undefined && m.away_score !== "";
  }
  function isUpcoming(m) { return !hasScore(m) && m.date >= todayIso(); }
  var FAV_KEY = "ksb-fav";
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem(FAV_KEY) || "{}") || {}; } catch (e) { favs = {}; }
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
  }
  var $q = document.getElementById("q");
  var $d = document.getElementById("d");
  var $list = document.getElementById("list");
  var $state = document.getElementById("state");
  var $count = document.getElementById("count");
  var $more = document.getElementById("more");
  var PAGE = 40;
  var shownCount = PAGE;

  function fmtDate(iso) {
    var p = iso.split("-");
    return p[2] + "." + p[1] + "." + p[0] + ".";
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function card(m) {
    var scored = hasScore(m);
    var soon = isUpcoming(m);
    var a = el("a", "match" + (scored ? "" : " pending"));
    a.href = m.url;
    a.target = "_blank";
    a.rel = "noopener";
    var top = el("div", "top");
    top.appendChild(el("span", "when", fmtDate(m.date) + (m.time ? " · " + m.time : "")));
    top.appendChild(el("span", "", m.competition));
    var teams = el("div", "teams");
    teams.appendChild(el("span", "team", m.home));
    teams.appendChild(el("span", "score" + (scored ? "" : (soon ? " soon" : " none")),
      scored ? m.home_score + ":" + m.away_score : (soon ? (m.time || "uskoro") : "bez rezultata")));
    teams.appendChild(el("span", "team away", m.away));
    a.appendChild(top);
    a.appendChild(teams);
    var isFav = !!favs[m.id];
    var li = el("li", "item" + (isFav ? " fav" : ""));
    li.appendChild(a);
    var star = el("button", "star" + (isFav ? " on" : ""), isFav ? "★" : "☆");
    star.type = "button";
    star.setAttribute("aria-label", isFav ? "Ukloni iz omiljenih" : "Dodaj u omiljene");
    star.setAttribute("aria-pressed", isFav ? "true" : "false");
    star.addEventListener("click", function () {
      if (favs[m.id]) delete favs[m.id]; else favs[m.id] = 1;
      saveFavs();
      render();
    });
    li.appendChild(star);
    return li;
  }

  function render() {
    var text = $q.value;
    var date = parseDate($d.value, true);
    // datum se može ukucati i u polje za ekipe: "zvezda partizan 20.11"
    if (!date) {
      var inline = parseDate(text, false);
      if (inline) { date = inline; text = text.replace(inline.raw, " "); }
    }
    var tokens = norm(text).split(" ").filter(function (t) {
      return t && t !== "vs" && t !== "-" && t !== "protiv";
    });
    var searching = tokens.length > 0 || date !== null || $d.value.trim() !== "";

    var hasUpcoming = all.some(isUpcoming);
    // kad se nesto trazi (ekipa/datum), a prikaz nije rucno izabran -> trazi u SVIM utakmicama
    var activeMode = mode || (searching ? "all" : (hasUpcoming ? "upcoming" : "played"));
    Array.prototype.forEach.call(document.querySelectorAll("button.tab"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-mode") === activeMode ? "true" : "false");
    });

    var res = all.filter(function (m) {
      if (activeMode === "upcoming" && !isUpcoming(m)) return false;
      if (activeMode === "played" && isUpcoming(m)) return false;
      if (date) {
        var p = m.date.split("-");
        if (parseInt(p[2], 10) !== date.d) return false;
        if (date.m !== null && parseInt(p[1], 10) !== date.m) return false;
        if (date.y !== null && parseInt(p[0], 10) !== date.y) return false;
      }
      if (tokens.length) {
        var hay = norm(m.home + " " + m.away + " " + m.competition);
        for (var i = 0; i < tokens.length; i++) if (hay.indexOf(tokens[i]) === -1) return false;
      }
      return true;
    });

    function key(m) { return m.date + " " + (m.time || "99:99"); }
    res = res.slice().sort(function (a, b) {
      var fa = favs[a.id] ? 1 : 0, fb = favs[b.id] ? 1 : 0;
      if (fa !== fb) return fb - fa;                       // omiljene prve
      var ua = isUpcoming(a), ub = isUpcoming(b);
      if (ua !== ub) return ua ? -1 : 1;                   // predstojeće pre odigranih
      if (ua) return key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0;   // predstojeće: najbliže prve
      return key(a) < key(b) ? 1 : key(a) > key(b) ? -1 : 0;           // odigrane: najnovije prve
    });

    var shown = res.slice(0, shownCount);
    $list.textContent = "";
    shown.forEach(function (m) { $list.appendChild(card(m)); });

    if (!all.length) {
      $count.textContent = "";
      $state.innerHTML = "";
      $state.appendChild(el("strong", "", "Podaci još nisu učitani"));
      $state.appendChild(document.createTextNode("Pokreni osvežavanje na GitHub-u (Actions → Osvezi utakmice → Run workflow)."));
    } else if (!shown.length) {
      $count.textContent = "0 rezultata";
      $state.innerHTML = "";
      if (activeMode === "upcoming" && !searching) {
        $state.appendChild(el("strong", "", "Nema predstojećih utakmica u podacima"));
        $state.appendChild(document.createTextNode("Tapni „Sve“ ili „Odigrane“. Raspored se dodaje kad ga KSB objavi."));
      } else {
        $state.appendChild(el("strong", "", "Nema podudaranja"));
        $state.appendChild(document.createTextNode("Probaj samo deo naziva (npr. „zvezda“), drugi datum (npr. 20.11) ili drugi prikaz (Predstojeće / Odigrane / Sve)."));
      }
    } else {
      var label = searching
        ? res.length + " rezultata"
        : (activeMode === "upcoming" ? "Predstojeće utakmice" : activeMode === "played" ? "Odigrane utakmice" : "Sve utakmice") + " (" + res.length + ")";
      $count.textContent = label + (res.length > shown.length ? " · prikazano " + shown.length : "");
      $state.textContent = "";
    }

    if (res.length > shown.length) {
      $more.hidden = false;
      $more.textContent = "Prikaži još (" + (res.length - shown.length) + ")";
    } else {
      $more.hidden = true;
    }
  }

  function resetAndRender() { shownCount = PAGE; render(); }

  function load(manual) {
    var $btn = document.getElementById("refresh");
    if (manual) { $btn.disabled = true; $btn.textContent = "Osvežavam…"; }
    fetch("utakmice.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        all = (data.matches || []).slice().sort(function (a, b) {
          return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
        });
        if (data.updated) {
          var dt = new Date(data.updated);
          document.querySelector("header p").textContent =
            "Osveženo " + dt.toLocaleString("sr-Latn-RS", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) +
            " · " + all.length + " utakmica";
        }
        render();
      })
      .catch(function () {
        if (!all.length) $state.textContent = "Ne mogu da učitam podatke. Proveri internet vezu.";
        else $count.textContent = "Osvežavanje nije uspelo";
      })
      .then(function () {
        $btn.disabled = false; $btn.textContent = "↻ Osveži";
      });
  }

  Array.prototype.forEach.call(document.querySelectorAll("button.tab"), function (b) {
    b.addEventListener("click", function () { mode = b.getAttribute("data-mode"); resetAndRender(); });
  });
  document.getElementById("refresh").addEventListener("click", function () { load(true); });
  $q.addEventListener("input", resetAndRender);
  $d.addEventListener("input", resetAndRender);
  $more.addEventListener("click", function () { shownCount += 50; render(); });
  document.getElementById("clear").addEventListener("click", function () {
    $q.value = ""; $d.value = ""; mode = null; resetAndRender(); $q.focus();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  load(false);
})();
</script>
</body>
</html>
